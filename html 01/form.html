<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        /* (Styling is the same as before) */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .form-container { width: 90%; max-width: 500px; margin: 20px auto; padding: 30px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        input[type="text"], input[type="email"], input[type="password"], select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .back-link { display: block; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Fill the form...</h2>
        
        <form action="#" method="GET">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="Name" placeholder="Enter Your Full Name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="Email" placeholder="Enter Your Mail id" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="Password" placeholder="Enter Your Password" required>
            </div>
            <div class="form-group">
                <p>Gender:</p>
                <input type="radio" id="male" name="Gender" value="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="Gender" value="Female">
                <label for="female">Female</label>
            </div>
            <div class="form-group">
                <p>Select any Language:</p>
                <input type="checkbox" id="english" name="Language" value="English">
                <label for="english">English</label><br>
                <input type="checkbox" id="spanish" name="Language" value="Spanish">
                <label for="spanish">Spanish</label><br>
                <input type="checkbox" id="arabic" name="Language" value="Arabic">
                <label for="arabic">Arabic</label>
            </div>
            <div class="form-group">
                <label for="subject">Select the subject:</label>
                <select id="subject" name="Subject">
                    <option value="default">Default</option>
                    <option value="frontend">Front-End</option>
                    <option value="backend">Back-End</option>
                    <option value="database">Database</option>
                </select>
            </div>
            <button type="submit">Submit</button>
        </form>

        <a href="index.html" class="back-link">Back to Main Page</a>
    </div>

</body>
</html>
