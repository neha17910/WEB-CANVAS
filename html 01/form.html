<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

</head>
<body>

    <div class="form-container">
        <h2>Fill the form...</h2>
        
        <form action="#" method="GET">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="Name" placeholder="Enter Your Full Name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="Email" placeholder="Enter Your Mail id" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="Password" placeholder="Enter Your Password" required>
            </div>
            <div class="form-group">
                <p>Gender:</p>
                <input type="radio" id="male" name="Gender" value="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="Gender" value="Female">
                <label for="female">Female</label>
            </div>
            <div class="form-group">
                <p>Select any Language:</p>
                <input type="checkbox" id="english" name="Language" value="English">
                <label for="english">English</label><br>
                <input type="checkbox" id="spanish" name="Language" value="Spanish">
                <label for="spanish">Spanish</label><br>
                <input type="checkbox" id="arabic" name="Language" value="Arabic">
                <label for="arabic">Arabic</label>
            </div>
            <div class="form-group">
                <label for="subject">Select the subject:</label>
                <select id="subject" name="Subject">
                    <option value="default">Default</option>
                    <option value="frontend">Front-End</option>
                    <option value="backend">Back-End</option>
                    <option value="database">Database</option>
                </select>
            </div>
            <button type="submit">Submit</button>
        </form>

        <a href="index.html" class="back-link">Back to Main Page</a>
    </div>

</body>

</html>
