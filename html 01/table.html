<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
    <style>
        /* (Styling is the same as before) */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { width: 90%; max-width: 600px; margin: 20px auto; padding: 30px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); text-align: center; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        .cell-label { width: 40%; text-align: left; border-right: none; }
        .game-cell { width: 12%; height: 40px; border-left: none; }
        .white-piece { width: 20px; height: 20px; background-color: white; border: 1px solid #333; border-radius: 50%; display: inline-block; }
        .black-piece { width: 20px; height: 20px; background-color: black; border-radius: 50%; display: inline-block; }
        .back-link { display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create a Table which looks like this 👇</h2>

        <table>
            <tr>
                <td class="cell-label">Starting position:</td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
            </tr>
            <tr>
                <td class="cell-label">Black moves ahead:</td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
            </tr>
            <tr>
                <td class="cell-label">White jumps:</td>
                <td class="game-cell"></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"></td>
                <td class="game-cell"></td>
            </tr>
            <tr>
                <td class="cell-label">Black moves ahead:</td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
            </tr>
            <tr>
                <td class="cell-label">Black jumps:</td>
                <td class="game-cell"></td>
                <td class="game-cell"></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"></td>
            </tr>
            <tr>
                <td class="cell-label">White moves ahead:</td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
            </tr>
        </table>

        <a href="index.html" class="back-link">Back to Main Page</a>
    </div>

</body>
</html>
