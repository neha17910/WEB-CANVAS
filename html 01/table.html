<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
    
</head>
<body>

    <div class="container">
        <h2>Create a Table which looks like this 👇</h2>

        <table>
            <tr>
                <td class="cell-label">Starting position:</td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
            </tr>
            <tr>
                <td class="cell-label">Black moves ahead:</td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
            </tr>
            <tr>
                <td class="cell-label">White jumps:</td>
                <td class="game-cell"></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"></td>
                <td class="game-cell"></td>
            </tr>
            <tr>
                <td class="cell-label">Black moves ahead:</td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
            </tr>
            <tr>
                <td class="cell-label">Black jumps:</td>
                <td class="game-cell"></td>
                <td class="game-cell"></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"></td>
            </tr>
            <tr>
                <td class="cell-label">White moves ahead:</td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
                <td class="game-cell"><span class="white-piece"></span></td>
                <td class="game-cell"><span class="black-piece"></span></td>
            </tr>
        </table>

        <a href="index.html" class="back-link">Back to Main Page</a>
    </div>

</body>

</html>
