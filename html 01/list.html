<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Examples</title>
    <style>
        /* (Styling is the same as before) */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { width: 90%; max-width: 600px; margin: 20px auto; padding: 30px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h2 { border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .back-link { display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Lists in HTML</h2>

        <ol>
            <li>Sample</li>
            <li>Sample
                <ol type="i">
                    <li>sample</li>
                    <li>sample</li>
                    <li>sample
                        <ul style="list-style-type: circle;">
                            <li>sample</li>
                            <li>sample</li>
                            <li>sample</li>
                        </ul>
                    </li>
                </ol>
            </li>
            <li>Sample
                <ul style="list-style-type: square;">
                    <li>sample
                        <ul>
                            <li>sample</li>
                            <li>sample</li>
                            <li>sample</li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ol>

        <a href="index.html" class="back-link">Back to Main Page</a>
    </div>

</body>
</html>
